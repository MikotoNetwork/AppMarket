name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      # 确保 Android SDK 环境正常并自动接受协议
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # 开启 Gradle 缓存，加速 KMP 构建
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 构建 Android Debug APK
      - name: Build Android Debug APK
        run: ./gradlew :app:android:assembleDebug --stacktrace

      # 查找生成的 APK（方便确认路径是否正确）
      - name: Find APK files
        if: always()
        run: find . -name "*.apk" -type f

      - name: Upload Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-android-debug
          path: app/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
